# Publishes the static site to GitHub Pages on every push.
#
# ONE-TIME SETUP, and it cannot be done from a workflow:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The workflow token is allowed to deploy to Pages but not to create the Pages
# site itself (the API answers "Resource not accessible by integration"), so
# `enablement: true` does not help — the switch has to be flipped by the owner.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/yummyland-candy-box-builder-ywg0ej]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Pull the candy photos off the Shopify CDN and into the build, so the
      # published site serves them itself. Deliberately not fatal: if the CDN
      # is unreachable the candies keep their cdn.shopify.com urls and the
      # site still works — it just has an external dependency that day.
      - name: Fetch candy photos
        continue-on-error: true
        run: |
          node tools/fetch-photos.js
          node tools/fetch-photos.js --check

      # Hash the css/js urls. A browser must never end up holding a cached
      # copy of one script beside a fresh copy of another — that mismatch
      # fails silently and takes whole sections of the page down with it.
      - name: Stamp asset versions
        run: node tools/stamp-assets.js

      # Publish only the site itself — the Shopify package, tooling and
      # workflows have no business being served to visitors.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html boxes.html gifts.html cart.html about.html faq.html 404.html \
                robots.txt sitemap.xml assets _site/
          du -sh _site/assets/img/candy 2>/dev/null || echo "photos: serving from the Shopify CDN"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
